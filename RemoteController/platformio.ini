; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32s3_board]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
build_src_filter =
    +<*>
    ; Force compile LVGL demo, remove when working on your own project
    +<../.pio/libdeps/esp32s3_board/lvgl/examples>
lib_deps =
    lvgl/lvgl @ ^9.4.0
    esp-arduino-libs/ESP32_Knob @ ^0.0.1
    ruiseixasm/Versatile_RotaryEncoder @ ^1.3.1
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
    moononournation/GFX Library for Arduino @ ~1.5.4
    https://github.com/mmMicky/TouchLib.git