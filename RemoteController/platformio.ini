; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = emulator_64bits

; Shared options
[env]
build_flags =
    -Iinclude
    -Ihal/common
    -DLV_CONF_INCLUDE_SIMPLE
    !python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('src')]))"
lib_deps =
    ; Use direct URL, because package registry is unstable
    lvgl/lvgl @ ^9.4.0
lib_archive = false


[env:emulator_64bits]
platform = native@^1.2.1
extra_scripts =
  pre:support/sdl2_paths.py ; Tries to find SDL2 include and lib paths on your system - specifically for MacOS w/ Homebrew
  post:support/sdl2_build_extra.py
build_flags =
  ${env.build_flags}
  ; Add recursive dirs for hal headers search
  !python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/sdl2')]))"
  -lSDL2
  ; SDL drivers options
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_USE_SDL

lib_deps =
  ${env.lib_deps}
build_src_filter =
  +<*>
  +<../hal/sdl2>
  ; Force compile LVGL demo, remove when working on your own project
  +<../.pio/libdeps/emulator_64bits/lvgl/demos>


[env:esp32s3_board]
platform = espressif32
; board = 4d_systems_esp32s3_gen4_r8n16
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    ${env.build_flags}
    ; Add recursive dirs for hal headers search
    !python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/esp32')]))"
build_src_filter =
    +<*>
    +<../hal/esp32>
    ; Force compile LVGL demo, remove when working on your own project
    +<../.pio/libdeps/esp32s3_board/lvgl/examples>
lib_deps =
    ${env.lib_deps}
    nrf24/RF24 @ ^1.5.0
    adafruit/Adafruit MPU6050 @ ^2.2.6
    koendv/cst816t @ ^1.5.1
    esp-arduino-libs/ESP32_Knob @ ^0.0.1
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
    moononournation/GFX Library for Arduino @ ~1.5.4